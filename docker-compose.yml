services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fuelstation
      POSTGRES_USER: fuel
      POSTGRES_PASSWORD: fuel
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - fuelstation_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuel -d fuelstation"]
      interval: 5s
      retries: 10
volumes:
  fuelstation_postgres:
